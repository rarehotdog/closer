name: rail-studio
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rail-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/rail-studio/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
